[project]
name = "clairity"
version = "0.1.0"
description = "Open-source AI-text detector: Binoculars-based scoring with per-sentence highlighting and evidence-backed reasons"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "roowus" }]
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "pysbd>=0.3.4",
    "rich>=13.0",
]

[project.scripts]
clairity = "clairity.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clairity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
